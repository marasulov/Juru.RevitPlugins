name: Publish release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional)"
        required: false
        type: string

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Общее ядро ClashNavigator - закрытый репозиторий marasulov/ClashNavigator.Core. Встроенный
      # GITHUB_TOKEN читает только этот репозиторий, поэтому ядро забирается отдельно своим токеном
      # (секрет CORE_TOKEN, Contents: Read на ядро) - на коммит, закреплённый в субмодуле.
      - name: Resolve ClashNavigator.Core commit
        id: core
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:external/ClashNavigator.Core)" >> "$GITHUB_OUTPUT"

      - name: Checkout ClashNavigator.Core
        uses: actions/checkout@v6
        with:
          repository: marasulov/ClashNavigator.Core
          ref: ${{ steps.core.outputs.sha }}
          token: ${{ secrets.CORE_TOKEN }}
          path: external/ClashNavigator.Core
          persist-credentials: false

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        shell: bash
        run: |
          set -e
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Cache packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish release
        run: dotnet run -c Release -- pack publish
        working-directory: "build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTNET_ENVIRONMENT: ${{ (github.ref_name == 'main' || github.ref_type == 'tag') && 'Production' || 'Development' }}
          Publish__Version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}