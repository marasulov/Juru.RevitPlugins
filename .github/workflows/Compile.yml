name: Compile solution

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Общее ядро ClashNavigator - закрытый репозиторий marasulov/ClashNavigator.Core. Встроенный
      # GITHUB_TOKEN читает только этот репозиторий, поэтому ядро забирается отдельно своим токеном
      # (секрет CORE_TOKEN, Contents: Read на ядро) - на коммит, закреплённый в субмодуле.
      - name: Resolve ClashNavigator.Core commit
        id: core
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:external/ClashNavigator.Core)" >> "$GITHUB_OUTPUT"

      - name: Checkout ClashNavigator.Core
        uses: actions/checkout@v6
        with:
          repository: marasulov/ClashNavigator.Core
          ref: ${{ steps.core.outputs.sha }}
          token: ${{ secrets.CORE_TOKEN }}
          path: external/ClashNavigator.Core
          persist-credentials: false

      - name: Cache packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Compile solution
        run: dotnet run -c Release
        working-directory: "build"
        env:
          DOTNET_ENVIRONMENT: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}

      # Тесты покрывают только логику без Revit API - Ревит на раннере не установлен.
      # Почему так и что из-за этого остаётся непокрытым - tests/Juru.RevitPlugins.Tests/Readme.md.
      - name: Run tests
        run: dotnet test tests/Juru.RevitPlugins.Tests/Juru.RevitPlugins.Tests.csproj -c Debug.R24 --nologo